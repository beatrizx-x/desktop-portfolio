<div
  class="window-frame"
  [class.maximized]="windowData.isMaximized"
  [style.zIndex]="windowData.zIndex"
  (mousedown)="focus()"
  cdkDrag
  [cdkDragDisabled]="windowData.isMaximized"
>
  <div class="window-header" cdkDragHandle>
    <span class="window-title">{{ windowData.title }}</span>

    <div class="window-controls">

      <!-- Botão Maximizar / Restaurar -->
      <button
        type="button"
        class="control-btn maximize"
        (click)="toggleMaximize()"
        aria-label="Maximizar"
        title="Maximizar"
      >
        <img
          [src]="windowData.isMaximized
            ? 'assets/iconeWin/VolumeDOWN.png'
            : 'assets/iconeWin/VolumeUP.png'"
          alt=""
        >
      </button>

      <!-- Botão Fechar -->
      <button
        type="button"
        class="control-btn close"
        (click)="close()"
        aria-label="Fechar"
        title="Fechar"
      >
        <img
          src="assets/iconeWin/Exit.png"
          alt=""
        >
      </button>

    </div>
  </div>

  <div class="window-body">
  <div class="window-content">
    <ng-container *ngComponentOutlet="windowData.component"></ng-container>
  </div>
</div>
